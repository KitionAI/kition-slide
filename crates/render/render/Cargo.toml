[package]
name = "kition-slide-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kition Slide renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
kition-slide-geom = { workspace = true }
kition-slide-color = { workspace = true }
kition-slide-model = { workspace = true }
kition-slide-fonts = { workspace = true }
kition-slide-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kition-office-core = { workspace = true }
kurbo = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
