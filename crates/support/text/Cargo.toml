[package]
name = "kition-slide-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kition Slide text layout: runs to shaped glyph lines with bullets, indents, spacing, alignment, anchoring, autofit and caret hit testing"

[lints]
workspace = true

[dependencies]
kition-office-core = { workspace = true }
kition-slide-model = { workspace = true }
kition-slide-geom = { workspace = true }
kition-slide-color = { workspace = true }
kition-slide-fonts = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
quick-xml = { workspace = true }
ttf-parser = "0.25.1"
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi = { workspace = true }
unicode-vo = { workspace = true }

# The local clock for date fields (no clock on wasm: fields keep their saved text).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { workspace = true }
