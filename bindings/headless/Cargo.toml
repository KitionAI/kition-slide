[package]
name = "kition-slide"
description = "The Slide kit for Kition's agent: the Kition SDK document served headless over the Kit Protocol."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
kition-slide-kit = { path = "../wasm" }
kition-headless = { workspace = true }

[dev-dependencies]
kition-kit-server = { workspace = true }
kition-kit = { workspace = true, features = ["session"] }
serde_json = { workspace = true }
kition-kits = { workspace = true }
# document.identity and document.fork through the real process (tests/identity.rs).
kition-kit-host = { workspace = true }
kition-env = { git = "https://github.com/KitionAI/kition-sdk", rev = "91cf510cd2e0ed2f9414693fd916959776a1a2f6" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
zip = { workspace = true }
kition-slide-engine = { workspace = true }
kition-slide-model = { workspace = true }
# workspace_only.rs: pictures as PNG, and a font no kit build bundles, installed in the test's home.
image = { workspace = true }
epaint_default_fonts = "0.36"
