    dimension: [ai, data-safety]
    priority: P0
    status: partial
    paths: [bindings/wasm/tests/premise_fork.rs, bindings/wasm/src/collab.rs, crates/kdm/kdm-model/src/stored.rs, bindings/wasm/tests/historical_media.rs, crates/engine/engine/src/cmd/file.rs, crates/kdm/kdm-model/model/schema.json, bindings/wasm/src/rests_media.rs, bindings/headless/tests/private_facts.rs, bindings/headless/tests/terminal_close.rs, bindings/headless/tests/raw_batches.rs, bindings/headless/tests/index_paths.rs, bindings/wasm/src/acts.rs, bindings/wasm/src/rests_slides.rs, bindings/wasm/src/rests_shapes.rs, bindings/wasm/src/rests_shapes_mine.rs, bindings/wasm/src/rests_text.rs, bindings/wasm/src/rests_other.rs, bindings/wasm/src/rests_deck.rs, bindings/wasm/src/rests_drawing.rs, bindings/wasm/src/rests_tables.rs, bindings/wasm/tests/declarations_independent.rs, bindings/wasm/tests/declarations_independent, bindings/headless/tests/independent.rs, bindings/headless/tests/independent_shapes.rs, bindings/headless/tests/independent_text.rs, bindings/headless/tests/independent_other.rs, bindings/headless/tests/independent_comments.rs, bindings/headless/tests/independent_rests_drawing.rs, bindings/headless/tests/independent_rests_shapes.rs, bindings/headless/tests/independent_rests_slides.rs, bindings/headless/tests/independent_rests_text.rs, bindings/headless/tests/independent_rests_narrow.rs]
    gap: "Independent declaration comparisons pass. Raw positional paragraph/table edits have direct contracts; persisted member identities guard nested gaps. Layout tool identities allow notes replay and exact holder paths guard unnamed layout shapes. Private facts stay private and guarded close planning terminates. animation.move holds only its item and destination gap (no animation content); the four table insertions (table.insertRowAbove/Below, table.insertColumnLeft/Right) still hold the whole table (cells, cols, rows, frame), which is correct for today's handler (it rewrites every cell's merge flags and the frame size) but refuses an unrelated change after their gap: narrowing them (neighbour rows/columns by identity, merges crossing the gap, the frame size recomputed) is post-launch work; a raw positional paragraph list.remove without basis applies (the removed object leaves the deck). History rereads retain local part numbers when layout identities/order are unchanged, and media numbers when its part and bytes are unchanged; a changed layout set/order is refused. Geometry ancestor bodies and session buffers remain conservative or incomplete."
    cases: [regressions/issue-animation-move-holds-places, regressions/issue-kit-hygiene-list-remove, regressions/issue-c8-slide-pin-r3-media-reread, regressions/issue-c8-slide-pin-r3-history-parts, regressions/issue-c8-slide-pin-r3-coverage, regressions/issue-c8-slide-pin-r3-premise-ids, regressions/issue-c8-slide-pin-r2-prefix, regressions/issue-c8-slide-pin-r2-layout-predicate, regressions/issue-c8-slide-pin-r2-media-membership, regressions/issue-c8-slide-pin-r2-created-style, regressions/issue-c8-slide-pin-r2-positional, regressions/issue-c8-slide-pin-r2-layout, regressions/issue-c8-slide-pin-r2-style, regressions/issue-c8-slide-pin-r2-media, regressions/issue-c8-slide-pin-r2-section-boundary, regressions/issue-c8-slide-pin-r2-private, regressions/issue-c8-slide-pin-r2-close, regressions/issue-c8-slide-pin-reread, regressions/issue-c8-slide-pin-batch-ops, regressions/issue-c8-slide-read-declarations, regressions/issue-c8-slide-read-editor-state, regressions/issue-c8-slide-read-2-comment-places, regressions/issue-c8-slide-read-2-comment-identity, regressions/issue-c8-slide-read-3-dynamic]
