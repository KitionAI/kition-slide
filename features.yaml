  - id: slide.collab.drafts
    title: "Drafts merge in and earlier versions restore as one undo step"
    dimension: [collab, data-safety]
    priority: P1
    status: partial
    paths: [bindings/wasm/src/collab.rs, bindings/wasm/src/lib.rs, crates/engine/engine/src/kdm_bridge.rs, crates/kdm/kdm-model/src/session.rs, web/tests/drafts.mjs]
    target: "Kit UI protocol sections 7d and 7m (draft/merge, replica/restore); engine contract members mergeChanges, compareChanges, restoreState, modelReply"
    gap: A draft is merged, undone and restored in the editor only through the dev host; Kition's own draft and version panels are not driven by a case. A draft's preview (compareChanges, through SlideSession::merged_state on Replica::merged_state_repaired) runs the replica's repair of the merged state but not what the engine writes from its view after the merge, in the merge's undo step (the text reflow and shrink-on-overflow fit (autofit::repair), the stored values settled and a repeated slide file id renumbered (stored::settle_merged), and the read repair of a paragraph or comment listed twice (siblings, comments::repair)); a draft that needs one previews without it, so its preview can differ from the merge in those fields.
    cases: [regressions/issue-merged-draft-person-undo, regressions/issue-merged-reflow-undo, regressions/issue-draft-preview-repaired, regressions/issue-merge-changing-nothing, regressions/issue-merge-follow-up-in-step, slide.collab.drafts/editor]
