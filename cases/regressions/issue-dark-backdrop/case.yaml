format: 1
id: regressions/issue-dark-backdrop
feature: slide.editor.host-theme
intent: >-
  The pasteboard the engine paints around the slide is the host's canvas color, and follows a live
  switch of the host's theme (dark, light, dark, no reload), with Kition's tokens as it sends them
  (`hsl(...)`); the slide stays white and in place. Before, the editor handed the engine only a
  `#rrggbb` canvas color and only when the document opened, so in Kition's dark scheme the whole
  backdrop around the slide stayed the engine's built-in light grey (Kition host matrix row H16).
