format: 1
id: regressions/issue-draft-preview-repaired
feature: slide.collab.drafts
intent: >-
  A draft's preview (compareChanges) runs the replica's repair of the merged state as the merge
  does (SlideSession::merged_state, Replica::merged_state_repaired on a copy), so it is what
  accepting the draft gives. Before, it was the merge without the repair: a draft animating a
  shape the document deleted meanwhile previewed the animation the merge's repair deletes, and the
  slide's kept timing tree naming that shape, which only the engine dropped after the merge (the
  replica's repair now drops a kept timing naming a deleted shape). Now the preview's merged state
  equals the state after merging, its comparison the merge's summary, and the document does not
  change.
layer: gate
source:
  kind: issue
  from: kition-sdk 7466039 alignment (draft preview repaired, 2026-11-26)
  license: owned
input: []
steps:
  - cargo-test:
      package: kition-slide-kit
      filter: collab::tests::a_drafts_preview_is_what_merging_it_gives_its_repair_included
expected:
  - actual: out:exit
    compare: exit
    value: 0
since: "2026-11-26"
timeout_s: 180
