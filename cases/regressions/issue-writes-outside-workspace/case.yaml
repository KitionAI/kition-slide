format: 1
id: regressions/issue-writes-outside-workspace
feature: slide.security.workspace
intent: >-
  The headless kit reads and writes only inside its workspace, through its host (KHP A29, A58,
  section 10.6): whatever an agent runs, directly or inside model.batch (as a script, as the agent,
  as a person it claims to be), and whatever its decks link, nothing appears in the process's
  current, home or temporary folder, nothing outside the workspace is read into an answer or a
  picture, changed or deleted, and no font folder of the machine is read: a family only the
  machine has is reported as slide.font-substituted. A session a host owns every file of opens,
  saves, exports, inserts media and keeps AutoRecover copies by no path, even when a gate lets the
  command through. An audit found the engine writing and reading any path it was given (file.save,
  file.saveAs, file.saveTemplate, file.export, file.open, image.insert, audio.insert,
  video.insert), a deck opened from its replica saved to its bare name in the current folder, and
  the kit scanning the machine's font folders and telling the agent which fonts were installed.
layer: gate
tags: [headless, security]
source:
  kind: probe
  from: workspace escape audit (slide section)
  license: owned
input: []
steps:
  - cargo-test:
      package: kition-slide
      test: workspace_only
  - cargo-test:
      package: kition-slide-engine
      filter: a_hosted_session_reaches_no_file_by_path
expected:
  - actual: out:exit
    compare: exit
    value: 0
timeout_s: 300
since: "2026-11-17"
