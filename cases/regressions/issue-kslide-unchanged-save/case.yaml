format: 1
id: regressions/issue-kslide-unchanged-save
feature: slide.file.presentations
intent: >-
  A .kslide holds the presentation and nothing else (owner 2026-11-24): two sessions that open the
  same file and save it without editing write byte-identical files, the very file they opened, and
  so does a session that opens it with the replica stored with it (every reopen in Kition
  Desktop): it keeps the file's master, layout, shape and media ids, where a fresh read of the
  replica numbered them anew. Before, `slide.json` named the build
  that wrote it (`generator`), so the same presentation saved by another build was another file,
  and a deck read from a PPTX carried that PPTX's view properties (last view, zoom) into the
  .kslide.
layer: gate
source:
  kind: issue
  from: Kition Slide regression suite
  license: owned
input: []
steps:
  - cargo-test:
      package: kition-slide-engine
      filter: two_sessions_that_open_the_same_kslide_save_it_unchanged_byte_for_byte
expected:
  - actual: out:exit
    compare: exit
    value: 0
since: "2026-11-24"
timeout_s: 120
