format: 1
id: regressions/issue-6
feature: slide.format.paragraph
intent: >-
  Vertical text (format.direction rotate90, rotate270, stacked) runs down its box: an auto-
  resizing text box keeps its height and fits its width to the columns (it shrank its height and
  wrapped the text by the box width), and fit and overflow are measured along the box height;
  one line of Arch Up text in a top- or bottom-anchored box follows the arch at its own size (it
  was stretched over the whole box, a band of the same height whatever the size).
