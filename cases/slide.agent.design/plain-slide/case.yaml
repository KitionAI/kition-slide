format: 1
id: slide.agent.design/plain-slide
feature: slide.agent.design
intent: >-
  A plain slide (small and close text sizes, an empty lower half, text only on a plain
  background, left edges a few points apart) gets design advice with the commands that change it,
  in slide.inspect and in the answer of the KitDrawing command that made the text; a designed
  slide gets none.
layer: gate
source:
