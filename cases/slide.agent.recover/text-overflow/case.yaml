format: 1
id: slide.agent.recover/text-overflow
feature: slide.agent.recover
intent: >-
  The agent finds overflowing text with the kit's check and makes it fit without changing its words
  (KHP Verify; khp-bench's layout suite).
layer: eval
source:
  kind: synthetic
  from: repo:conformance/check-text-overflow.kslide
  license: Apache-2.0
  note: A copy of the conformance fixture for slide.text-overflow.
input: [input/overflow.kslide]
steps:
  - inspect: { path: overflow.kslide, args: { target: { slide: 1 } }, as: before }
  - task:
      prompt: Check overflow.kslide with the kit and fix what it reports, without changing any words on the slides.
      max_turns: 25
  - inspect: { path: overflow.kslide, args: { target: { slide: 1 } }, as: after }
  - check: { path: overflow.kslide, as: diagnostics }
expected:
  - actual: out:diagnostics
    compare: diagnostics
    value: { absent: [slide.text-overflow], max_errors: 0 }
  - actual: out:after
    compare: kdm-json
    against: out:before
    ignore: [edit, summary, dirty, canUndo, canRedo, revision, "part.shapes.*.box", part.design]
    collateral: true
solution:
  - tool: slide_run
    args: { path: overflow.kslide, steps: [{ command: format.autofit, params: { ids: [262], mode: shrink, onSlide: 1 } }] }
since: "2026-11-17"
timeout_s: 600
