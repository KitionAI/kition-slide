[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]
default-members = ["crates/*/*", "bindings/headless", "tools/xtask"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-slide"

[workspace.dependencies]
# kition-sdk, pinned by commit (one revision for every crate of it)
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
kition-convergence = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
# A host of kit processes (`HeadlessKit`), for the `document.identity` tests.
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
# The kits' MCP server's tools (kition-kits-mcp), for the headless kit's end-to-end tests.
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
# internal
kition-slide-geom = { path = "crates/support/geom" }
kition-office-core = { git = "https://github.com/KitionAI/kition-sdk", rev = "6672663ab40248752234a69369fde2136fd73b37" }
kition-slide-color = { path = "crates/support/color" }
kition-slide-model = { path = "crates/engine/model" }
kition-slide-fonts = { path = "crates/support/fonts" }
kition-slide-text = { path = "crates/support/text" }
kition-slide-render = { path = "crates/render/render" }
kition-slide-pdf = { path = "crates/formats/pdf" }
kition-slide-pptx = { path = "crates/formats/pptx" }
kition-slide-format = { path = "crates/formats/format" }
kition-slide-engine = { path = "crates/engine/engine" }
kdm-model = { path = "crates/kdm/kdm-model" }
kition-slide-media = { path = "crates/media/media" }
# codecs (ported from Kition Film, same owner and licence)
kition-slide-bitstream = { path = "crates/media/bitstream" }
kition-slide-h264 = { path = "crates/media/h264" }
kition-slide-hevc = { path = "crates/media/hevc" }
kition-slide-vp9 = { path = "crates/media/vp9" }
kition-slide-av1 = { path = "crates/media/av1" }
kition-slide-isobmff = { path = "crates/media/isobmff" }
kition-slide-matroska = { path = "crates/media/matroska" }
kition-slide-ogg = { path = "crates/media/ogg" }
kition-slide-opus = { path = "crates/media/opus" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-vo = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
krilla = { version = "0.8", features = ["pdf"] }
i_overlay = "9"
quick-xml = "0.38"
zip = { version = "3", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
